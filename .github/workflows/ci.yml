name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript, lint and Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check the package
        run: npx tsc --noEmit

      - name: Type-check the config plugin
        run: npx tsc -p plugin --noEmit

      - name: Lint
        run: npx eslint src plugin/src

      - name: Jest (JS API and config plugin)
        run: npm test -- --ci
